<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1d102b">
    <meta name="description" content="Nexum.">
    <title>Happy Birthday, My Favorite Person</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css?v=3.0">
</head>
<body>
    <audio id="backgroundMusic" src="LANY-XXL.mp3" preload="metadata"></audio>

    <div class="app-shell">
        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>
        <div class="ambient ambient-three"></div>
        <div id="floatingDecor" class="floating-decor" aria-hidden="true"></div>

        <header class="topbar">
            <div class="brand-wrap">
                <div class="brand-icon">☾</div>
                <div class="brand-copy">
                    <div class="brand-title">Nexum</div>
                    <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
                </div>
            </div>
            <div class="top-actions">
                <button class="icon-btn" id="quoteButton" type="button" aria-label="Open Quote">❝</button>
                <button class="icon-btn" id="musicButton" type="button" aria-label="Play Music">♪</button>
                <button class="icon-btn" id="playlistButton" type="button" aria-label="Open Playlist">☷</button>
                <button class="icon-btn" id="resetButton" type="button" aria-label="Repeat Game">↻</button>
            </div>
        </header>

        <main id="stageRoot" class="stage-root" aria-live="polite"></main>
    </div>

    <div id="modalRoot"></div>

    <script>
        const CONFIG = {"recipientName":"Zhafirah Afrah","senderName":"Raynold Anthonio Sebastian","birthdayText":"Happy Birthday, My Favorite Person","birthdayDate":"A Tiny Universe Made Only For You","recipientAge":"21","heroPhoto":"","musicTracks":[{"title":"LANY - XXL","file":"LANY-XXL.mp3"},{"title":"Ed Sheeran - Perfect","file":"Ed Sheeran-Perfect.mp3"},{"title":"Katy Perry - The One That Got Away","file":"Katy Perry-The One That Got Away.mp3"}],"intro":"Aku Tidak Ingin Memberimu Ucapan Ulang Tahun Yang Biasa Saja...Jadi Aku Menyimpan Beberapa Hal Kecil Di Dalam Dunia Ini Yang Sudah Aku Siapkan Untukmu Dan Cukup Mainkan Pelan-Pelan, Ya Karena Setiap Chapter Punya Satu Potongan Rasa Yang Ingin Aku Sampaikan.","quotes":["Aku Tidak Pernah Mencintai Siapa Pun Selain Dirimu, Karena Sejak Awal Hatiku Selalu Menemukan Jalan Pulang Yang Sama.","Apa Pun Yang Membentuk Jiwa Kita, Rasanya Jiwamu Dan Jiwaku Memang Diciptakan Dari Hal Yang Sama.","Cinta Yang Tulus Tidak Akan Berubah Hanya Karena Waktu, Jarak, Atau Keadaan Sedang Tidak Berpihak Kepada Kita.","Cinta Tidak Selalu Tentang Memiliki, Karena Terkadang Mencintai Berarti Memberikan Ruang Agar Seseorang Tetap Menjadi Dirinya Sendiri.","Jika Aku Harus Menghitung Semua Alasan Mengapa Aku Mencintaimu, Mungkin Satu Kehidupan Tidak Akan Pernah Cukup."],"quiz":[{"question":"Kalau Dunia Memberi Kita Satu Hari Untuk Menghilang Tanpa Dicari Siapa Pun, Kamu Ingin Aku Membawamu Ke Mana?","options":["Ke Pantai Yang Sepi, Supaya Kita Bisa Duduk Berdua Sampai Langit Berubah Warna.","Ke Kota Kecil Yang Dipenuhi Lampu Malam, Supaya Kita Bisa Berjalan Tanpa Tujuan Sambil Menggenggam Tangan.","Tidak Perlu Pergi Ke Mana-Mana, Asalkan Ada Kamu, Makanan Favorit Kita, Dan Waktu Yang Berjalan Lebih Lambat."],"replies":["Aku Akan Duduk Di Sampingmu, Mendengarkan Ombak, Lalu Diam-Diam Berharap Hari Itu Tidak Pernah Selesai.","Aku Akan Menggenggam Tanganmu Lebih Erat, Karena Bersamamu Bahkan Jalan Yang Tidak Kita Kenal Bisa Terasa Seperti Rumah.","Mungkin Tempat Terindah Memang Bukan Tentang Seberapa Jauh Kita Pergi, Tetapi Tentang Siapa Yang Ada Di Samping Kita."]},{"question":"Kalau Umur Barumu Adalah Awal Dari Sebuah Perjalanan Baru, Hal Apa Yang Paling Ingin Kamu Bawa Agar Hatimu Tetap Baik-Baik Saja?","options":["Keberanian Untuk Mengejar Hal-Hal Yang Selama Ini Diam-Diam Kamu Impikan.","Ketenangan Untuk Tetap Tersenyum, Bahkan Saat Dunia Sedang Tidak Berjalan Sesuai Keinginanmu.","Lebih Banyak Momen Bahagia Yang Suatu Hari Bisa Kamu Kenang Dengan Senyuman."],"replies":["Semoga Kamu Selalu Punya Keberanian Untuk Melangkah, Dan Semoga Aku Masih Boleh Berada Di Sampingmu Saat Kamu Meraih Semua Impianmu.","Semoga Hatimu Selalu Menemukan Tempat Untuk Beristirahat, Dan Semoga Suatu Hari Kamu Menyadari Bahwa Kamu Tidak Harus Menghadapi Semuanya Sendirian.","Semoga Umur Barumu Dipenuhi Banyak Alasan Untuk Tersenyum, Dan Semoga Aku Bisa Menjadi Salah Satu Dari Alasan Kecil Itu."]},{"question":"Setelah Semua Perjalanan Kecil Ini, Apakah Kamu Siap Membuka Satu Pesan Yang Selama Ini Ingin Aku Sampaikan Langsung Kepada Hatimu?","options":["Aku Siap, Tetapi Tolong Biarkan Aku Membukanya Perlahan Agar Setiap Katanya Bisa Aku Rasakan.","Aku Siap, Karena Sejak Awal Aku Sudah Penasaran Dengan Hal Yang Diam-Diam Kamu Simpan Untukku.","Aku Sedikit Gugup, Tetapi Aku Tetap Ingin Membukanya Karena Aku Tahu Pesan Itu Datang Dari Hatimu."],"replies":["Bacalah Perlahan, Karena Ada Beberapa Perasaan Yang Tidak Ingin Aku Sampaikan Dengan Terburu-Buru.","Aku Sudah Menduga Kamu Akan Memilih Ini, Jadi Bersiaplah Membuka Bagian Yang Paling Tulus Dari Seluruh Perjalanan Kecil Ini.","Tidak Apa-Apa Jika Kamu Sedikit Gugup, Karena Jujur Saja Aku Juga Gugup Saat Menuliskan Semua Kata Yang Akan Kamu Baca Setelah Ini."]}],"letterPages":[{"title":"Untuk Kamu Yang Berhasil Sampai Di Hari Ini","body":"Happy Birthday 21Th, Vira! Sebelum Hari Ini Berlalu, Aku Ingin Kamu Berhenti Sebentar Dan Melihat Sejauh Apa Kamu Sudah Berjalan. Mungkin Tidak Semua Orang Tahu Berapa Banyak Hal Yang Sudah Kamu Lewati Dalam Diam Dan Mungkin Tidak Semua Orang Mengerti Seberapa Sering Kamu Harus Terlihat Baik-Baik Saja Saat Hatimu Sedang Lelah. Tetapi Kamu Tetap Bertahan, Tetap Melangkah, Dan Tetap Menjadi Pribadi Yang Begitu Berharga. Im Proud For You, Lebih Dari Yang Selama Ini Mampu Aku Ungkapkan Dengan Sebuah Kata-Kata."},{"title":"Terima Kasih Karena Telah Menjadi Bagian Terindah Dari Hariku","body":"Terima Kasih Karena Sudah Hadir Dengan Caramu Yang Sederhana, Tetapi Selalu Berhasil Membuat Banyak Hal Terasa Lebih Berarti. Terima Kasih Untuk Cerita-Cerita Kecilmu, Candaan Randommu, Perhatianmu, Dan Setiap Pesan Singkat Yang Diam-Diam Mampu Membuat Hariku Jauh Lebih Baik. Mungkin Kamu Tidak Pernah Menyadarinya, Tetapi Kehadiranmu Punya Cara Ajaib Untuk Membuat Hari Yang Melelahkan Terasa Lebih Ringan. Sejak Mengenalmu, Aku Mulai Mengerti Bahwa Bahagia Ternyata Bisa Sesederhana Mengetahui Bahwa Ada Kamu Di Dalam Hariku."},{"title":"Doaku Untuk Setiap Langkah Yang Akan Kamu Tempuh","body":"Di Umur Barumu Ini, Aku Tidak Hanya Berharap Kamu Mendapatkan Banyak Kebahagiaan. Aku Juga Berharap Hatimu Menjadi Lebih Tenang, Langkahmu Menjadi Lebih Ringan, Dan Isi Kepalamu Menjadi Jauh Lebih Ramah Kepada Dirimu Sendiri. Semoga Kamu Selalu Dikelilingi Oleh Orang-Orang Yang Tulus, Dipertemukan Dengan Banyak Kesempatan Baik, Dan Diberi Keberanian Untuk Mengejar Semua Hal Yang Selama Ini Diam-Diam Kamu Impikan. Semoga Setiap Air Mata Yang Pernah Kamu Sembunyikan Digantikan Oleh Senyuman Yang Jauh Lebih Indah Dari Yang Pernah Kamu Bayangkan."},{"title":"Jika Suatu Hari Dunia Terasa Terlalu Berat","body":"Jika Suatu Hari Dunia Terasa Terlalu Ramai Dan Kamu Merasa Lelah Menjadi Kuat, Tolong Jangan Memaksa Dirimu Untuk Menghadapi Semuanya Sendirian. Kamu Tidak Harus Selalu Terlihat Baik-Baik Saja. Kamu Tidak Harus Selalu Punya Jawaban Untuk Setiap Masalah. Beristirahatlah Saat Kamu Membutuhkannya, Menangislah Jika Itu Bisa Membuat Hatimu Sedikit Lebih Lega, Dan Ingatlah Bahwa Akan Selalu Ada Seseorang Yang Ingin Mendengarkanmu Tanpa Menghakimimu. Jika Kamu Mengizinkannya, Aku Ingin Menjadi Salah Satu Tempat Yang Bisa Kamu Tuju Saat Dunia Sedang Tidak Bersikap Ramah Kepadamu."},{"title":"Satu Hal Terakhir Yang Ingin Aku Sampaikan Kepadamu","body":"Aku Tidak Tahu Seberapa Panjang Perjalanan Yang Masih Menunggu Kita Di Depan. Aku Juga Tidak Bisa Menjanjikan Bahwa Semua Hari Akan Selalu Berjalan Dengan Mudah. Tetapi Selama Aku Masih Diberi Kesempatan Untuk Berada Di Sampingmu, Aku Ingin Terus Belajar Memahamimu, Menjagamu, Dan Menyayangimu Dengan Cara Yang Paling Kamu Butuhkan. Selamat Bertambah Usia, Sayang. Semoga Semua Hal Baik Yang Selama Ini Kamu Berikan Kepada Banyak Orang Kembali Kepadamu Dengan Cara Yang Jauh Lebih Indah. Dan Di Antara Banyak Kebahagiaan Yang Akan Menemanimu Nanti, Aku Berharap Aku Masih Boleh Menjadi Salah Satu Alasan Kecil Di Balik Senyummu."}]};
        const MUSIC_TRACKS = Array.isArray(CONFIG.musicTracks) && CONFIG.musicTracks.length
            ? CONFIG.musicTracks
            : [{ title: 'LANY - XXL', file: 'LANY-XXL.mp3' }];

        const CHAPTERS = ['cover', 'hearts', 'memory', 'quiz', 'meter', 'letter'];
        const PROGRESS = { cover: 0, hearts: 18, memory: 38, quiz: 60, meter: 82, letter: 100 };
        const STORAGE_KEY = 'birthday-love-quest-stage';

        const HEART_GAME = {
            targetScore: 18,
            duration: 30,
            normalLifetime: 1320,
            minimumLifetime: 650,
            speedStep: 30
        };

        function createHeartGameState() {
            return {
                status: 'idle',
                score: 0,
                timeLeft: HEART_GAME.duration,
                combo: 0,
                bestCombo: 0,
                message: 'Tekan Tombol Mulai, Lalu Kumpulkan 18 Poin Sebelum Waktunya Habis.',
                activeHeart: null,
                countdownTimer: null,
                spawnTimer: null,
                expireTimer: null
            };
        }

        const MEMORY_CARDS = [
            { pair: 'home', emoji: '🏡', label: 'Tempat Pulang' },
            { pair: 'home', emoji: '🏡', label: 'Tempat Pulang' },
            { pair: 'laugh', emoji: '🌻', label: 'Tawa Favorit' },
            { pair: 'laugh', emoji: '🌻', label: 'Tawa Favorit' },
            { pair: 'journey', emoji: '🌙', label: 'Cerita Panjang' },
            { pair: 'journey', emoji: '🌙', label: 'Cerita Panjang' }
        ];

        const state = {
            stage: getSavedStage(),
            heartGame: createHeartGameState(),
            musicOn: false,
            musicIndex: 0,
            memoryCards: [],
            selectedCards: [],
            matchedCards: [],
            cardLocked: false,
            quizIndex: 0,
            quizChoice: null,
            meter: 0,
            meterTimer: null,
            letterOpened: false,
            letterPage: 0,
            quoteIndex: 0
        };

        const stageRoot = document.getElementById('stageRoot');
        const modalRoot = document.getElementById('modalRoot');
        const progressBar = document.getElementById('progressBar');
        const backgroundMusic = document.getElementById('backgroundMusic');
        const musicButton = document.getElementById('musicButton');
        const playlistButton = document.getElementById('playlistButton');

        function getStoredItem(key) {
            try {
                return localStorage.getItem(key);
            } catch (error) {
                return null;
            }
        }

        function setStoredItem(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (error) {
                // Ignore Storage Errors Gracefully
            }
        }

        function removeStoredItem(key) {
            try {
                localStorage.removeItem(key);
            } catch (error) {
                // Ignore Storage Errors Gracefully
            }
        }

        function getSavedStage() {
            const saved = getStoredItem(STORAGE_KEY);
            return CHAPTERS.includes(saved) ? saved : 'cover';
        }

        function saveStage() {
            setStoredItem(STORAGE_KEY, state.stage);
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function shuffle(items) {
            return [...items]
                .map((item) => ({ item, order: Math.random() }))
                .sort((a, b) => a.order - b.order)
                .map(({ item }, index) => ({ ...item, id: `${item.pair}-${index}` }));
        }

        function updateProgress() {
            progressBar.style.width = `${PROGRESS[state.stage]}%`;
        }

        function pill(text) {
            return `<div class="pill"><span>✦</span>${escapeHtml(text)}</div>`;
        }

        function primaryButton(id, label, extraClass = '') {
            return `<button id="${id}" class="primary-btn ${extraClass}" type="button">${escapeHtml(label)} <span>›</span></button>`;
        }

        function secondaryButton(id, label, extraClass = '') {
            return `<button id="${id}" class="secondary-btn ${extraClass}" type="button">${escapeHtml(label)} <span>✦</span></button>`;
        }

        function getInitials(name) {
            return String(name || '')
                .split(/\s+/)
                .filter(Boolean)
                .slice(0, 2)
                .map((part) => part.charAt(0).toUpperCase())
                .join('') || '♥';
        }


        function getCurrentTrack() {
            return MUSIC_TRACKS[state.musicIndex] || MUSIC_TRACKS[0];
        }

        function renderTrackOptions() {
            return MUSIC_TRACKS.map((track, index) => `
                <option value="${index}" ${index === state.musicIndex ? 'selected' : ''}>
                    ${escapeHtml(track.title)}
                </option>
            `).join('');
        }

        function updateMusicUi() {
            const track = getCurrentTrack();
            const coverTitle = document.getElementById('coverNowPlayingTitle');
            const coverSelect = document.getElementById('coverTrackSelect');
            const coverPlayButton = document.getElementById('coverPlayTrackButton');
            const modalTitle = document.getElementById('playlistCurrentTitle');
            const modalPlayButton = document.getElementById('playlistPlayButton');

            musicButton.textContent = state.musicOn ? '♫' : '♪';
            musicButton.setAttribute('aria-label', state.musicOn ? 'Pause Music' : 'Play Music');

            if (coverTitle) coverTitle.textContent = track.title;
            if (coverSelect) coverSelect.value = String(state.musicIndex);
            if (coverPlayButton) {
                coverPlayButton.textContent = state.musicOn ? 'Ⅱ' : '▶';
                coverPlayButton.setAttribute('aria-label', state.musicOn ? 'Pause Music' : 'Play Music');
            }
            if (modalTitle) modalTitle.textContent = track.title;
            if (modalPlayButton) {
                modalPlayButton.textContent = state.musicOn ? 'Ⅱ' : '▶';
                modalPlayButton.setAttribute('aria-label', state.musicOn ? 'Pause Music' : 'Play Music');
            }

            document.querySelectorAll('[data-track-index]').forEach((button) => {
                const isActive = Number(button.dataset.trackIndex) === state.musicIndex;
                button.classList.toggle('is-active', isActive);

                const helper = button.querySelector('small');
                const symbol = button.querySelector('.playlist-track-symbol');
                if (helper) helper.textContent = isActive ? 'Now Playing Or Ready To Play' : 'Tap To Choose This Song';
                if (symbol) symbol.textContent = isActive ? '♫' : '›';
            });
        }

        async function selectTrack(index, shouldPlay = state.musicOn) {
            const nextIndex = (Number(index) + MUSIC_TRACKS.length) % MUSIC_TRACKS.length;
            const nextTrack = MUSIC_TRACKS[nextIndex];

            state.musicIndex = nextIndex;
            backgroundMusic.pause();
            backgroundMusic.src = nextTrack.file;
            backgroundMusic.load();
            updateMusicUi();

            if (shouldPlay) await playMusic();
        }

        async function changeTrack(step, shouldPlay = state.musicOn) {
            await selectTrack(state.musicIndex + step, shouldPlay);
        }

        function bindCoverMusicControls() {
            const previousButton = document.getElementById('coverPrevTrackButton');
            const playButton = document.getElementById('coverPlayTrackButton');
            const nextButton = document.getElementById('coverNextTrackButton');
            const select = document.getElementById('coverTrackSelect');

            if (previousButton) previousButton.addEventListener('click', () => changeTrack(-1, true));
            if (playButton) playButton.addEventListener('click', () => state.musicOn ? pauseMusic() : playMusic());
            if (nextButton) nextButton.addEventListener('click', () => changeTrack(1, true));
            if (select) select.addEventListener('change', (event) => selectTrack(event.target.value, true));

            updateMusicUi();
        }

        function renderPlaylistModal() {
            const currentTrack = getCurrentTrack();
            const playlistItems = MUSIC_TRACKS.map((track, index) => `
                <button
                    class="playlist-track ${index === state.musicIndex ? 'is-active' : ''}"
                    data-track-index="${index}"
                    type="button"
                >
                    <span class="playlist-track-number">${String(index + 1).padStart(2, '0')}</span>
                    <span class="playlist-track-copy">
                        <strong>${escapeHtml(track.title)}</strong>
                        <small>${index === state.musicIndex ? 'Now Playing Or Ready To Play' : 'Tap To Choose This Song'}</small>
                    </span>
                    <span class="playlist-track-symbol">${index === state.musicIndex ? '♫' : '›'}</span>
                </button>
            `).join('');

            modalRoot.innerHTML = `
                <div class="modal-backdrop" id="playlistBackdrop" role="presentation">
                    <div class="playlist-modal modal-enter" role="dialog" aria-modal="true" aria-labelledby="playlistModalTitle">
                        <div class="playlist-modal-header">
                            <div>
                                <p class="modal-eyebrow">Your Little Playlist</p>
                                <h2 id="playlistModalTitle">Choose The Song You Like</h2>
                            </div>
                            <button id="closePlaylistButton" class="icon-btn" type="button" aria-label="Close Playlist">×</button>
                        </div>

                        <div class="playlist-now-playing glass-card">
                            <span class="music-mini-label">Now Playing</span>
                            <strong id="playlistCurrentTitle">${escapeHtml(currentTrack.title)}</strong>
                            <div class="playlist-controls">
                                <button id="playlistPrevButton" class="playlist-control-btn" type="button" aria-label="Previous Song">‹</button>
                                <button id="playlistPlayButton" class="playlist-control-btn is-primary" type="button" aria-label="${state.musicOn ? 'Pause Music' : 'Play Music'}">${state.musicOn ? 'Ⅱ' : '▶'}</button>
                                <button id="playlistNextButton" class="playlist-control-btn" type="button" aria-label="Next Song">›</button>
                            </div>
                        </div>

                        <div class="playlist-track-list">${playlistItems}</div>
                        <p class="playlist-note">The Next Song Will Play Automatically After The Current Song Ends.</p>
                    </div>
                </div>
            `;

            document.getElementById('closePlaylistButton').addEventListener('click', closeModal);
            document.getElementById('playlistBackdrop').addEventListener('click', (event) => {
                if (event.target.id === 'playlistBackdrop') closeModal();
            });
            document.getElementById('playlistPrevButton').addEventListener('click', () => changeTrack(-1, true));
            document.getElementById('playlistPlayButton').addEventListener('click', () => state.musicOn ? pauseMusic() : playMusic());
            document.getElementById('playlistNextButton').addEventListener('click', () => changeTrack(1, true));
            document.querySelectorAll('[data-track-index]').forEach((button) => {
                button.addEventListener('click', () => selectTrack(button.dataset.trackIndex, true));
            });

            updateMusicUi();
        }

        function chapterShell({ eyebrow, title, description = '', content = '' }) {
            return `
                <section class="chapter chapter-enter">
                    ${pill(eyebrow)}
                    <h1 class="chapter-title">${escapeHtml(title)}</h1>
                    ${description ? `<p class="chapter-description">${escapeHtml(description)}</p>` : ''}
                    ${content}
                </section>
            `;
        }

        function setStage(nextStage) {
            state.stage = nextStage;
            saveStage();
            updateProgress();
            renderStage();
        }

        function showCompletion(nextStage, message) {
            modalRoot.innerHTML = `
                <div class="modal-backdrop" role="presentation">
                    <div class="modal-card modal-enter" role="dialog" aria-modal="true">
                        <div class="modal-symbol">★</div>
                        <p class="modal-eyebrow">Chapter Unlocked</p>
                        <p class="modal-message">${escapeHtml(message)}</p>
                        ${primaryButton('continueChapterButton', 'Lanjutkan Perjalanan')}
                    </div>
                </div>
            `;
            document.getElementById('continueChapterButton').addEventListener('click', () => {
                modalRoot.innerHTML = '';
                setStage(nextStage);
            });
        }

        function renderCover() {
            const highlights = (CONFIG.coverHighlights || [])
                .map((item) => `<span class="cover-chip">${escapeHtml(item)}</span>`)
                .join('');

            const heroAvatar = CONFIG.heroPhoto
                ? `<img src="${escapeHtml(CONFIG.heroPhoto)}" alt="Photo Of ${escapeHtml(CONFIG.recipientName)}">`
                : `<span class="hero-avatar-empty" aria-hidden="true"></span>`;

            const previewItems = [
                'Heart Rush',
                'Memory Match',
                'Tiny Conversation',
                'Love Meter',
                'Final Letter'
            ].map((item) => `<li><span>✦</span>${escapeHtml(item)}</li>`).join('');

            stageRoot.innerHTML = chapterShell({
                eyebrow: 'A Private Little Universe',
                title: CONFIG.birthdayText,
                description: CONFIG.intro,
                content: `
                    <div class="cover-layout">
                        <div class="cover-main">
                            <div class="glass-card intro-card intro-card-enhanced">
                                <div class="gift-icon">🎁</div>
                                <div class="intro-copy">
                                    <p class="micro-label">For ${escapeHtml(CONFIG.recipientName)}</p>
                                    <p>${escapeHtml(CONFIG.birthdayDate)} & Ada Beberapa Chapter Kecil Sebelum Hadiah Utamanya Terbuka.</p>
                                </div>
                            </div>

                            <div class="cover-chip-row">${highlights}</div>

                            <div class="glass-card promise-card">
                                <div class="promise-copy">
                                    <span class="promise-kicker">Little Surprise</span>
                                    <h3>Every Click Opens A New Little Feeling</h3>
                                    <p>Ada Mini Game, Sedikit Catatan Manis, Dan Satu Surat Terakhir Yang Sudah Aku Siapkan Khusus Untukmu.</p>
                                </div>
                                <div class="promise-points">
                                    <span><b>5</b> Chapters</span>
                                    <span><b>${escapeHtml(CONFIG.recipientAge || '21')}</b> Years Of Magic</span>
                                    <span><b>1</b> Final Letter</span>
                                </div>
                            </div>

                            <div class="cover-action-row">
                                ${primaryButton('startButton', "Let's Start")}
                                ${secondaryButton('peekQuoteButton', 'Open A Little Quote')}
                            </div>
                            <p class="small-note">Use Headphones For The Best Feeling</p>
                        </div>

                        <div class="cover-side">
                            <div class="glass-card cover-visual">
                                <span class="visual-glow visual-glow-one" aria-hidden="true"></span>
                                <span class="visual-glow visual-glow-two" aria-hidden="true"></span>
                                <div class="hero-badge hero-badge-top">Made With Love</div>
                                <div class="hero-badge hero-badge-side">${escapeHtml(CONFIG.recipientAge || '21')}</div>

                                <div class="hero-avatar-wrap">
                                    <div class="hero-avatar-ring"></div>
                                    <div class="hero-avatar">${heroAvatar}</div>
                                    <div class="hero-avatar-caption">
                                        <strong>${escapeHtml(CONFIG.recipientName)}</strong>
                                        <span>The Favorite Person In This Little Universe</span>
                                    </div>
                                </div>

                                <div class="music-mini-card glass-card">
                                    <div class="music-mini-head">
                                        <div>
                                            <span class="music-mini-label">Now Playing</span>
                                            <strong id="coverNowPlayingTitle">${escapeHtml(getCurrentTrack().title)}</strong>
                                        </div>
                                        <div class="music-bars" aria-hidden="true">
                                            <span></span><span></span><span></span><span></span>
                                        </div>
                                    </div>

        function heartParticlesMarkup() {
            return Array.from({ length: 16 }, (_, index) => {
                const left = (index * 37 + 9) % 94;
                const top = (index * 53 + 13) % 88;
                const delay = (index % 8) * 0.38;
                const duration = 4.8 + (index % 5) * 0.7;
                const size = 3 + (index % 4);
                return `<span style="--particle-left:${left}%;--particle-top:${top}%;--particle-delay:${delay}s;--particle-duration:${duration}s;--particle-size:${size}px"></span>`;
            }).join('');
        }

        function renderHearts() {
            const game = state.heartGame;
            const isPlaying = game.status === 'playing';
            const isFailed = game.status === 'failed';
            const actionLabel = isFailed ? 'Coba Sekali Lagi' : 'Mulai Tantangan';

                ? game.message
                : 'Tangkap Hati Baik Yang Terus Bergerak, Cari Golden Heart Untuk Bonus, Dan Jangan Sampai Menyentuh Hati Retak!.';

            stageRoot.innerHTML = chapterShell({

                                <div class="heart-stat" data-heart-stat="combo">

                            <div class="heart-progress-track" aria-hidden="true"><span id="heartProgressFill" style="width:${progress}%"></span></div>

                                ${isPlaying ? '' : `

                                            <span class="start-spark spark-one">✦</span>
                                            <span class="start-spark spark-two">✦</span>
                                            <span class="start-spark spark-three">✦</span>

                                        <p class="heart-start-kicker">${isFailed ? 'Try Again' : '30 Second Challenge'}</p>

        function startHeartGame() {
            stopHeartGameTimers();
            state.heartGame = createHeartGameState();
            state.heartGame.status = 'playing';
            state.heartGame.message = 'Mulai! Kejar Hati Yang Baik Dan Pertahankan Combo-mu.';
            renderHearts();
            updateHeartHud();
            spawnHeart();

            state.heartGame.countdownTimer = setInterval(() => {
                const game = state.heartGame;
                if (game.status !== 'playing') return;
                game.timeLeft = Math.max(0, game.timeLeft - 1);
                updateHeartHud();
                if (game.timeLeft <= 0) finishHeartGame(false);
            }, 1000);
        }

        function stopHeartGameTimers() {
            const game = state.heartGame;
            if (!game) return;
            if (game.countdownTimer) clearInterval(game.countdownTimer);
            if (game.spawnTimer) clearTimeout(game.spawnTimer);
            if (game.expireTimer) clearTimeout(game.expireTimer);
            game.countdownTimer = null;
            game.spawnTimer = null;
            game.expireTimer = null;
        }

        function spawnHeart() {
            const game = state.heartGame;
            if (game.status !== 'playing') return;

            const roll = Math.random();
            const type = roll < 0.16 ? 'trap' : roll < 0.34 ? 'gold' : 'normal';
            const size = type === 'gold' ? 52 : type === 'trap' ? 47 : 43 + Math.floor(Math.random() * 8);
            game.activeHeart = {
                id: `${Date.now()}-${Math.random()}`,
                type,
                x: 12 + Math.floor(Math.random() * 76),
                y: 14 + Math.floor(Math.random() * 68),
                driftX: -34 + Math.floor(Math.random() * 69),
                driftY: -23 + Math.floor(Math.random() * 47),
                flight: 720 + Math.floor(Math.random() * 440),
                size
            };

            drawActiveHeart();
            const lifetime = Math.max(
                HEART_GAME.minimumLifetime,
                HEART_GAME.normalLifetime - game.score * HEART_GAME.speedStep
            );
            game.expireTimer = setTimeout(() => expireHeart(), type === 'trap' ? lifetime * 0.8 : lifetime);
        }

        function drawActiveHeart() {
            const area = document.getElementById('heartPlayArea');
            const heart = state.heartGame.activeHeart;
            if (!area || !heart) return;

            const previous = area.querySelector('.rush-heart');
            if (previous) previous.remove();

            area.insertAdjacentHTML('beforeend', `
                <button
                    class="rush-heart ${heart.type}"
                    data-heart-type="${heart.type}"
                    style="left:${heart.x}%;top:${heart.y}%;--heart-size:${heart.size}px;--drift-x:${heart.driftX}px;--drift-y:${heart.driftY}px;--heart-flight:${heart.flight}ms"
                    type="button"
                    aria-label="${heart.type === 'trap' ? 'Hati Retak Jangan Ditekan!' : heart.type === 'gold' ? 'Tangkap golden heart' : 'Tangkap hati'}"
                >
                    <span class="rush-heart-aura"></span>
                    <span class="rush-heart-core">♥</span>
                    <span class="rush-heart-spark spark-one">✦</span>
                    <span class="rush-heart-spark spark-two">✦</span>
                </button>
            `);

            area.querySelector('.rush-heart').addEventListener('pointerdown', catchRushHeart);
        }

        function showHeartFeedback(text, type, x, y) {
            const area = document.getElementById('heartPlayArea');
            if (!area) return;
            const feedback = document.createElement('span');
            feedback.className = `heart-feedback ${type}`;
            feedback.style.left = `${x}%`;
            feedback.style.top = `${y}%`;
            feedback.textContent = text;
            area.appendChild(feedback);
            setTimeout(() => feedback.remove(), 720);
        }

        function catchRushHeart(event) {
            event.preventDefault();
            const game = state.heartGame;
            if (game.status !== 'playing' || !game.activeHeart) return;

            clearTimeout(game.expireTimer);
            game.expireTimer = null;
            const activeHeart = game.activeHeart;
            const type = activeHeart.type;
            game.activeHeart = null;
            event.currentTarget.classList.add('is-caught');

            if (type === 'trap') {
                game.timeLeft = Math.max(0, game.timeLeft - 3);
                game.combo = 0;
                game.message = 'Ups, Kamu Menyentuh Hati Retak! Waktumu Berkurang 3 Detik.';
                showHeartFeedback('-3s', 'trap', activeHeart.x, activeHeart.y);
            } else if (type === 'gold') {
                game.score += 3;
                game.timeLeft += 2;
                game.combo += 1;
                game.message = 'Golden heart! Bonus 3 poin dan tambahan waktu 2 detik.';
                showHeartFeedback('+3 · +2s', 'gold', activeHeart.x, activeHeart.y);
            } else {
                game.score += 1;
                game.combo += 1;
                game.message = game.combo > 1 ? `Nice! Combo x${game.combo}. Jangan Kehilangan Ritmenya.` : 'Satu Hati Berhasil Ditangkap. Kejar Yang Berikutnya!';
                showHeartFeedback(game.combo >= 3 ? `+1 · x${game.combo}` : '+1', 'normal', activeHeart.x, activeHeart.y);
            }

            game.bestCombo = Math.max(game.bestCombo, game.combo);
            updateHeartHud();

            if (game.score >= HEART_GAME.targetScore) {
                setTimeout(() => finishHeartGame(true), 230);
                return;
            }

            if (game.timeLeft <= 0) {
                finishHeartGame(false);
                return;
            }

            game.spawnTimer = setTimeout(spawnHeart, 175);
        }

        function expireHeart() {
            const game = state.heartGame;
            if (game.status !== 'playing' || !game.activeHeart) return;

            const missedHeart = game.activeHeart;
            if (missedHeart.type !== 'trap') {
                game.combo = 0;
                game.message = 'Hatinya Lolos! Combo Kembali Ke Nol, Ayo Fokus Lagi!';
                showHeartFeedback('Missed', 'missed', missedHeart.x, missedHeart.y);
            } else {
                game.message = 'Bagus, Kamu Berhasil Menghindari Hati Retak.';
                showHeartFeedback('Nice dodge', 'dodge', missedHeart.x, missedHeart.y);
            }

            game.activeHeart = null;
            const area = document.getElementById('heartPlayArea');
            const heart = area?.querySelector('.rush-heart');
            if (heart) heart.remove();
            updateHeartHud();
            game.spawnTimer = setTimeout(spawnHeart, 170);
        }

        function updateHeartHud() {
            const game = state.heartGame;
            const score = document.getElementById('heartScore');
            const time = document.getElementById('heartTime');
            const combo = document.getElementById('heartCombo');
            const message = document.getElementById('heartGameMessage');
            const progress = document.getElementById('heartProgressFill');
            const board = document.querySelector('.hearts-board');
            const timeStat = document.querySelector('[data-heart-stat="time"]');
            const comboStat = document.querySelector('[data-heart-stat="combo"]');

            if (score) score.innerHTML = `${game.score}<small> / ${HEART_GAME.targetScore}</small>`;
            if (time) time.innerHTML = `${game.timeLeft}<small>s</small>`;
            if (combo) combo.textContent = `x${game.combo}`;
            if (message) message.textContent = game.message;
            if (progress) progress.style.width = `${Math.min(100, (game.score / HEART_GAME.targetScore) * 100)}%`;
            if (timeStat) timeStat.classList.toggle('is-danger', game.timeLeft <= 8 && game.status === 'playing');
            if (comboStat) comboStat.classList.toggle('is-hot', game.combo >= 3);
            if (board) board.classList.toggle('is-pressure', game.timeLeft <= 8 && game.status === 'playing');
        }

        function finishHeartGame(success) {
            const game = state.heartGame;
            if (game.status !== 'playing') return;
            stopHeartGameTimers();
            game.activeHeart = null;
            const area = document.getElementById('heartPlayArea');
            const heart = area?.querySelector('.rush-heart');
            if (heart) heart.remove();

            if (success) {
                game.status = 'complete';
                const board = document.querySelector('.hearts-board');
                if (board) board.classList.add('is-complete');
                setTimeout(() => {
                    showCompletion('memory', `Challenge Selesai! Kamu Mengumpulkan ${game.score} Poin Dengan Combo Terbaik x${game.bestCombo}. Kehadiranmu Punya Cara Sederhana Untuk Membuat Banyak Hal Terasa Lebih Baik.`);
                }, 380);
                return;
            }

            game.status = 'failed';
            game.message = `Waktunya Habis! Kamu Mendapat ${game.score} dari ${HEART_GAME.targetScore} Poin Dengan Combo Terbaik x${game.bestCombo}. Yuk, Coba Lagi.`;
            renderHearts();
        }

        function renderMemory() {
            if (!state.memoryCards.length) state.memoryCards = shuffle(MEMORY_CARDS);

            const cardsMarkup = state.memoryCards.map((card) => {
                const flipped = state.selectedCards.includes(card.id) || state.matchedCards.includes(card.id);
                const matched = state.matchedCards.includes(card.id);
                return `
                    <button class="memory-card ${flipped ? 'is-flipped' : ''} ${matched ? 'is-matched' : ''}" data-card="${escapeHtml(card.id)}" type="button">
                        <span class="memory-card-inner">
                            <span class="memory-face memory-front">♡</span>
                            <span class="memory-face memory-back"><b>${card.emoji}</b><small>${escapeHtml(card.label)}</small></span>
                        </span>
                    </button>
                `;
            }).join('');

            stageRoot.innerHTML = chapterShell({
                eyebrow: 'Chapter 02 · Match The Memories',
                title: 'Cocokkan Hal-Hal Kecil Yang Terasa Seperti Rumah',
                description: 'Buka Dua Kartu Dan Temukan Tiga Pasangan Yang Sama Untuk Membuka Chapter Berikutnya!',
                content: `
                    <div class="memory-grid">${cardsMarkup}</div>
                    <p class="small-note">Pasangan ditemukan: ${state.matchedCards.length / 2} / 3</p>
                `
            });

            document.querySelectorAll('.memory-card').forEach((button) => {
                button.addEventListener('click', () => chooseMemoryCard(button.dataset.card));
            });
        }

        function chooseMemoryCard(cardId) {
            if (state.cardLocked || state.selectedCards.includes(cardId) || state.matchedCards.includes(cardId)) return;
            state.selectedCards.push(cardId);
            renderMemory();

            if (state.selectedCards.length === 2) {
                state.cardLocked = true;
                const [firstId, secondId] = state.selectedCards;
                const firstCard = state.memoryCards.find((card) => card.id === firstId);
                const secondCard = state.memoryCards.find((card) => card.id === secondId);

                setTimeout(() => {
                    if (firstCard && secondCard && firstCard.pair === secondCard.pair) {
                        state.matchedCards.push(firstId, secondId);
                    }
                    state.selectedCards = [];
                    state.cardLocked = false;

                    if (state.matchedCards.length === MEMORY_CARDS.length) {
                        renderMemory();
                        setTimeout(() => showCompletion('quiz', 'Semua Pasangan Sudah Ditemukan! Mungkin Rasa Nyaman Memang Seperti Itu...Bukan Selalu Tentang Hal Besar, Tetapi Tentang Sesuatu Yang Terasa Tepat Saat Ditemukan.'), 320);
                    } else {
                        renderMemory();
                    }
                }, 650);
            }
        }

            const current = CONFIG.quiz[state.quizIndex];
            const options = current.options.map((option, index) => `
    <button 
        class="quiz-option ${state.quizChoice === index ? 'selected' : ''}"

        type="button"
    >
        <span class="quiz-option-text">${escapeHtml(option)}</span>
        <span class="quiz-option-mark">✓</span>

`).join('');

const reply = state.quizChoice !== null
    ? `
        <div class="quiz-reply" role="status" aria-live="polite">

            <div class="quiz-reply-content">

                <p>${escapeHtml(current.replies[state.quizChoice])}</p>

        </div>

            const buttonText = state.quizIndex === CONFIG.quiz.length - 1 ? 'Buka Chapter Berikutnya' : 'Lanjutkan';

            stageRoot.innerHTML = chapterShell({
                eyebrow: `Chapter 03 · A Tiny Conversation · ${state.quizIndex + 1}/${CONFIG.quiz.length}`,
                title: current.question,
                description: 'Tidak Ada Jawaban Salah...Aku Hanya Ingin Meninggalkan Respons Kecil Untuk Setiap Pilihanmu!',
                content: `
                    <div class="quiz-options">${options}</div>

                if (state.quizChoice === null) return;
                if (state.quizIndex === CONFIG.quiz.length - 1) {

                    return;
                }
                state.quizIndex += 1;
                state.quizChoice = null;
                renderQuiz();
            });

        function meterMessage() {
            if (state.meter < 20) return 'Sedikit Lagi...Ada Beberapa Kata Yang Belum Selesai Aku Sampaikan.';
if (state.meter < 40) return 'Terima Kasih Sudah Membuat Banyak Hari Biasa Terasa Lebih Hangat.';
if (state.meter < 60) return 'Semoga Umur Barumu Membawa Lebih Banyak Tenang Daripada Cemas.';
if (state.meter < 80) return 'Semoga Kamu Selalu Menemukan Alasan Untuk Bangga Pada Dirimu Sendiri.';
if (state.meter < 100) return 'Hampir Terbuka. Ini Bagian Yang Paling Ingin Aku Berikan Kepadamu.';
return 'Unlocked. Surat Kecil Ini Akhirnya Menjadi Milikmu.';
        }

        function renderMeter() {
            stageRoot.innerHTML = chapterShell({
                eyebrow: 'Chapter 04 · Hold The Feeling',
                title: 'Tekan Dan Tahan Sampai Love Meter Penuh',
                description: 'Chapter Terakhir Sebelum Hadiah Utama Terbuka! Tahan Tombolnya & Jangan Dilepas Terlalu Cepat!.',
                content: `
                    <div class="glass-card meter-card">
                        <div class="meter-head"><span>Love Meter</span><span id="meterValue">${state.meter}%</span></div>
                        <div class="meter-track"><div id="meterFill" class="meter-fill" style="width:${state.meter}%"></div></div>
                        <p id="meterMessage" class="meter-message">${escapeHtml(meterMessage())}</p>
                    </div>

                    <p class="small-note">Press And Hold</p>
                `
            });

            const holdButton = document.getElementById('holdButton');
            ['pointerdown', 'touchstart'].forEach((eventName) => holdButton.addEventListener(eventName, startMeter));
            ['pointerup', 'pointerleave', 'pointercancel', 'touchend'].forEach((eventName) => holdButton.addEventListener(eventName, stopMeter));
        }

        function startMeter(event) {
            event.preventDefault();
            if (state.meterTimer || state.meter >= 100) return;
            state.meterTimer = setInterval(() => {
                state.meter = Math.min(100, state.meter + 2);
                const meterValue = document.getElementById('meterValue');
                const meterFill = document.getElementById('meterFill');
                const meterCopy = document.getElementById('meterMessage');
                if (meterValue) meterValue.textContent = `${state.meter}%`;
                if (meterFill) meterFill.style.width = `${state.meter}%`;
                if (meterCopy) meterCopy.textContent = meterMessage();
                if (state.meter >= 100) {
                    stopMeter();
                    setTimeout(() => showCompletion('letter', 'Love Meter Penuh! Kamu Berhasil Menyelesaikan Semua Chapter & Hadiah Utama Sekarang Sudah Bisa Dibuka.'), 340);
                }
            }, 55);
        }

        function stopMeter() {
            if (!state.meterTimer) return;
            clearInterval(state.meterTimer);
            state.meterTimer = null;
        }

        function renderLetter() {
            if (!state.letterOpened) {
                stageRoot.innerHTML = chapterShell({

                    title: 'Satu Surat Terakhir Menunggumu',
                    description: 'Gamenya Selesai! Sekarang Bagian Yang Paling Penting...Buka Saat Kamu Sudah Siap!',

            const page = CONFIG.letterPages[state.letterPage];
            const dots = CONFIG.letterPages.map((_, index) => `<span class="letter-dot ${index === state.letterPage ? 'active' : ''}"></span>`).join('');
            const action = state.letterPage < CONFIG.letterPages.length - 1
                ? `<button id="nextLetterButton" class="text-button" type="button">Halaman Berikutnya <span>›</span></button>`
                : `<span class="quest-complete">★ Quest Completed</span>`;

                eyebrow: `A letter from ${CONFIG.senderName}`,

        }

        function renderStage() {
            stopMeter();
            if (state.stage !== 'hearts') stopHeartGameTimers();
            updateProgress();
            if (state.stage === 'cover') renderCover();
            if (state.stage === 'hearts') renderHearts();
            if (state.stage === 'memory') renderMemory();
            if (state.stage === 'quiz') renderQuiz();
            if (state.stage === 'meter') renderMeter();
            if (state.stage === 'letter') renderLetter();
        }

        function renderQuoteModal() {
            modalRoot.innerHTML = `
                <div class="modal-backdrop" id="quoteBackdrop" role="presentation">
                    <div class="quote-modal modal-enter" role="dialog" aria-modal="true">
                        <div class="quote-header">
                            ${pill('Words For You')}
                            <button id="closeQuoteButton" class="text-button" type="button">Close</button>
                        </div>
                        <p class="quote-copy">“${escapeHtml(CONFIG.quotes[state.quoteIndex])}”</p>
                        <div class="quote-footer">
                            <span>${state.quoteIndex + 1} / ${CONFIG.quotes.length}</span>
                            <button id="nextQuoteButton" class="text-button" type="button">Quote Berikutnya <span>›</span></button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('closeQuoteButton').addEventListener('click', closeModal);
            document.getElementById('quoteBackdrop').addEventListener('click', (event) => {
                if (event.target.id === 'quoteBackdrop') closeModal();
            });
            document.getElementById('nextQuoteButton').addEventListener('click', () => {
                state.quoteIndex = (state.quoteIndex + 1) % CONFIG.quotes.length;
                renderQuoteModal();
            });
        }

        function closeModal() {
            modalRoot.innerHTML = '';
        }

        async function playMusic() {
            try {
                await backgroundMusic.play();
                state.musicOn = true;
                updateMusicUi();
            } catch (error) {
                state.musicOn = false;
                updateMusicUi();
                console.info('Tambahkan File Lagu MP3 Sesuai Nama Pada README, Lalu Mulai Musik Melalui Interaksi Pengguna.', error);
            }
        }

        function pauseMusic() {
            backgroundMusic.pause();
            state.musicOn = false;
            updateMusicUi();
        }

        function resetGame() {
            stopMeter();
            stopHeartGameTimers();
            pauseMusic();
            removeStoredItem(STORAGE_KEY);
            Object.assign(state, {
                stage: 'cover',
                musicIndex: 0,
                heartGame: createHeartGameState(),
                memoryCards: [],
                selectedCards: [],
                matchedCards: [],
                cardLocked: false,
                quizIndex: 0,
                quizChoice: null,
                meter: 0,
                meterTimer: null,
                letterOpened: false,
                letterPage: 0,
                quoteIndex: 0
            });
            backgroundMusic.src = MUSIC_TRACKS[0].file;
            backgroundMusic.load();
            closeModal();
            renderStage();
        }

        function renderFloatingDecor() {
            const decorRoot = document.getElementById('floatingDecor');
            const symbols = ['♥', '✦', '·', '♡'];
            decorRoot.innerHTML = Array.from({ length: 30 }, (_, index) => {
                const left = (index * 43) % 100;
                const top = (index * 67) % 100;
                const delay = (index % 9) * 0.7;
                const duration = 7 + (index % 6);
                const size = 10 + (index % 5) * 3;
                return `<span style="left:${left}%;top:${top}%;animation-delay:${delay}s;animation-duration:${duration}s;font-size:${size}px">${symbols[index % symbols.length]}</span>`;
            }).join('');
        }

        document.getElementById('quoteButton').addEventListener('click', renderQuoteModal);
        musicButton.addEventListener('click', () => state.musicOn ? pauseMusic() : playMusic());
        playlistButton.addEventListener('click', renderPlaylistModal);
        backgroundMusic.addEventListener('ended', () => changeTrack(1, true));
        document.getElementById('resetButton').addEventListener('click', resetGame);

        renderFloatingDecor();
        renderStage();
    </script>
</body>
</html>
